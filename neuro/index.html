<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ROMetrics — Clinical Anatomy Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#0f172a; --panel:rgba(15,23,42,0.95); --accent:#38bdf8; --text:#f1f5f9; --muted:#94a3b8; --border:#334155; }
html,body{ margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
canvas{position:fixed;inset:0;width:100%;height:100%;outline:none;}
#uiPanel{
  position:fixed;right:20px;top:20px;width:340px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  max-height:90vh;overflow-y:auto;
}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;}
select,input[type=range]{width:100%;padding:10px;border-radius:8px;margin-bottom:10px;background:#1e293b;color:#fff;border:1px solid var(--border);}
#dataDisplay{margin-top:15px;font-size:14px;line-height:1.6;}
</style>

<script type="importmap">
{ "imports":{ "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>

<body>
<canvas id="c"></canvas>

<div id="uiPanel">
  <label>Visualization Mode</label>
  <select id="modeSel">
    <option value="derm">Dermatomes</option>
    <option value="myo">Myotomes</option>
    <option value="none">Model Only</option>
  </select>

  <label>Overlay Opacity</label>
  <input id="opacitySel" type="range" min="0" max="1" step="0.05" value="0.85"/>

  <div id="dataDisplay">
    <div style="padding:20px;text-align:center;color:#64748b;border:2px dashed #334155;border-radius:8px;">
      Hover or click a region to view clinical data.
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.2,3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;

scene.add(new THREE.AmbientLight(0xffffff,1));
const dir = new THREE.DirectionalLight(0xffffff,2);
dir.position.set(5,10,7);
scene.add(dir);

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath("https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/");
loader.setDRACOLoader(draco);

function getModelURL(){
  const u=new URL(location.href);
  const q=u.searchParams.get("model");
  return (q && /^https?:/i.test(q))?q:"../assets/Roma_ROMetrics.glb";
}

let regionMeshes={};

loader.load(getModelURL(),g=>{
  const model=g.scene;
  scene.add(model);
  const b=new THREE.Box3().setFromObject(model);
  const c=b.getCenter(new THREE.Vector3());
  const s=b.getSize(new THREE.Vector3());
  controls.target.copy(c);
  camera.position.set(c.x,c.y,c.z+s.length());
  controls.update();
});

// DOTS REMOVED — EMPTY FUNCTION
function generateMaps(mesh){ return; }

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
