<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ROMetrics — Case Modules</title>

<style>
  :root{
    --bg:#020617; --panel:#0b1120; --panel-soft:#0f172a;
    --accent:#38bdf8; --accent-strong:#0ea5e9;
    --border:#1f2937; --muted:#94a3b8; --text:#e5e7eb;
    --good:#22c55e; --bad:#f97316;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body,html{
    height:100%;background:#020617;
    font-family:system-ui,Segoe UI,Roboto;color:var(--text);
    display:flex;justify-content:center;
  }
  .app-shell{
    flex:1;max-width:1100px;margin:10px;
    background:var(--panel-soft);border-radius:14px;
    border:1px solid var(--border);overflow:hidden;
    display:flex;flex-direction:column;
  }
  header{
    padding:10px 14px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
  }
  main{flex:1;display:flex;min-height:0}

  /* Sidebar */
  .sidebar{
    width:240px;border-right:1px solid var(--border);
    background:#020617;padding:11px;
  }
  .case-item{
    padding:8px 9px;border-radius:10px;
    background:#0f172a;border:1px solid var(--border);
    margin-bottom:6px;cursor:pointer;transition:.12s;
  }
  .case-item:hover{border-color:var(--accent)}
  .case-item.active{
    border-color:var(--accent-strong);
    background:#0b1120;
  }

  /* Content */
  .content{
    flex:1;padding:14px;display:flex;flex-direction:column;gap:14px;
  }
  .card{
    background:#0b1120;border:1px solid var(--border);
    border-radius:12px;padding:10px;
  }
  .case-preview{font-size:13px;color:var(--muted)}

  /* Documentation panel */
  #docPanel{
    background:#0b1120;border:1px solid var(--border);
    border-radius:14px;padding:14px;display:none;
    margin-top:10px;animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #docPanel.locked{display:none}
  #docPanel h3{margin-bottom:8px}

  .doc-field{
    margin-bottom:12px;
  }
  .doc-label{font-size:13px;color:var(--muted);margin-bottom:4px}
  .doc-line{
    width:100%;border:none;border-bottom:1px solid var(--border);
    background:transparent;color:var(--text);
    padding:4px 2px;font-size:14px;
  }
  textarea{
    width:100%;min-height:70px;border-radius:8px;
    background:#020617;border:1px solid var(--border);
    padding:6px;font-size:13px;color:var(--text);
  }

  #submitDocBtn{
    padding:8px 14px;border:none;border-radius:999px;
    background:var(--accent);color:#000;font-weight:600;
    cursor:pointer;margin-top:10px;
  }

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;display:none;
    background:rgba(0,0,0,0.7);justify-content:center;align-items:center;
  }
  .modal-backdrop.active{display:flex}
  .modal{
    width:520px;background:#0b1120;border:1px solid var(--border);
    border-radius:12px;padding:14px;max-height:80vh;overflow:auto;
  }
  .modal h3{margin-bottom:8px}
  #modalBody{white-space:pre-wrap;font-size:13px;color:var(--muted)}
  .primary-btn{
    margin-top:10px;padding:8px 14px;border:none;border-radius:999px;
    background:var(--accent);color:#000;font-weight:600;cursor:pointer;
  }
</style>
</head>

<body>
<div class="app-shell">
<header>
  <h2 style="font-size:16px;">ROMetrics <span style="color:var(--accent)">Case Modules</span></h2>
</header>

<main>
  <aside class="sidebar">
    <h3 style="font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;">Cases</h3>
    <div id="caseList"></div>
  </aside>

  <section class="content">
    <div>
      <h2 id="caseTitle">Select a case to begin</h2>
      <p id="caseSubtitle" style="font-size:13px;color:var(--muted)">Cases load dynamically.</p>
      <button id="startBtn" class="primary-btn" disabled>Open Case</button>
    </div>

    <div class="card">
      <h3>Case Snapshot</h3>
      <div id="casePreview" class="case-preview">Select a case.</div>
    </div>

    <!-- Documentation Panel -->
    <div id="docPanel" class="locked">
      <h3>Case Documentation</h3>

      <div class="doc-field">
        <div class="doc-label">ROM Findings</div>
        <input class="doc-line" id="romField" placeholder="Example: Left rotation limited to 40° (pain-limited)">
      </div>

      <div class="doc-field">
        <div class="doc-label">MMT Findings</div>
        <input class="doc-line" id="mmtField" placeholder="Example: Left cervical rotators 4/5">
      </div>

      <div class="doc-field">
        <div class="doc-label">Diagnosis</div>
        <input class="doc-line" id="diagField" placeholder="Enter suspected diagnosis">
      </div>

      <div class="doc-field">
        <div class="doc-label">Treatment Plan</div>
        <textarea id="treatmentField" placeholder="Interventions, education, dosage..."></textarea>
      </div>

      <div class="doc-field">
        <div class="doc-label">Goals</div>
        <textarea id="goalsField" placeholder="Short-term and long-term goals"></textarea>
      </div>

      <div class="doc-field">
        <div class="doc-label">Prognosis</div>
        <input class="doc-line" id="prognosisField" placeholder="Good / Fair / Excellent, with reasoning">
      </div>

      <button id="submitDocBtn">Submit Documentation</button>
      <div id="scoreBox" style="margin-top:12px;font-size:14px;"></div>
    </div>

  </section>
</main>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <button id="confirmRead" class="primary-btn">I have read this</button>
  </div>
</div>

<script>
const CASE_FILES = [
  { id:"case_001", path:"./assets/cases/case_001.md" }
];

let loadedCases = [];
let selectedCase = null;

/* Load Markdown Case */
async function loadCaseFile(id, path){
  const res = await fetch(path);
  if(!res.ok){ console.error("MD not found:", path); }
  const raw = await res.text();

  const jsonStart = raw.indexOf("{");
  const jsonEnd   = raw.indexOf("}")+1;
  const jsonText  = raw.slice(jsonStart, jsonEnd);
  const metadata  = JSON.parse(jsonText);

  const titleMatch = raw.match(/^#\s*(.+)$/m);
  const title = titleMatch ? titleMatch[1] : id;

  const preview = raw.split("\n").slice(10, 17).join(" ");

  return { id, raw, metadata, title, preview };
}

async function initCases(){
  for(let c of CASE_FILES){
    loadedCases.push(await loadCaseFile(c.id, c.path));
  }
  renderCaseList();
}

function renderCaseList(){
  const list=document.getElementById("caseList");
  list.innerHTML="";
  loadedCases.forEach(c=>{
    const item=document.createElement("div");
    item.className="case-item";
    item.innerHTML=`<div>${c.title}</div>`;
    item.onclick=()=>selectCase(c.id);
    list.appendChild(item);
  });
}

function selectCase(id){
  selectedCase=loadedCases.find(x=>x.id===id);
  document.getElementById("caseTitle").textContent=selectedCase.title;
  document.getElementById("casePreview").textContent=selectedCase.preview;
  document.getElementById("startBtn").disabled=false;
}

/* Modal Show */
document.getElementById("startBtn").onclick=()=>{
  document.getElementById("modalTitle").textContent=selectedCase.title;
  document.getElementById("modalBody").textContent=selectedCase.raw;
  document.getElementById("modalBackdrop").classList.add("active");
};

document.getElementById("confirmRead").onclick=()=>{
  document.getElementById("modalBackdrop").classList.remove("active");
  const docPanel=document.getElementById("docPanel");
  docPanel.style.display="block";
};

/* Documentation Scoring */
document.getElementById("submitDocBtn").onclick=()=>{
  const meta = selectedCase.metadata;
  let score=0;

  /* ROM tolerance */
  const studentROM=document.getElementById("romField").value;
  const targetROM=meta.limits.goniometry_limit.cervical_left_rotation;
  if(studentROM.match(/\d+/)){
    const num=parseInt(studentROM.match(/\d+/)[0]);
    if(Math.abs(num-targetROM)<=5) score+=1;
  }

  /* MMT exact */
  const studentMMT=document.getElementById("mmtField").value;
  if(studentMMT.includes("4/5")) score+=1;

  /* Diagnosis accepted */
  const dxList=["facet dysfunction","joint sprain","mechanical cervical pain","cervical sprain"];
  const dx=document.getElementById("diagField").value.toLowerCase();
  if(dxList.some(x=>dx.includes(x))) score+=1;

  let level="Novice"; if(score==2) level="Apprentice"; if(score==3) level="Clinical";

  document.getElementById("scoreBox").innerHTML=
    `Score: ${score}/3 — <span class="${score==3?'good':'bad'}">${level}</span>`;
};

initCases();
</script>

</body>
</html>
