<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ROMetrics — Case Modules Prototype</title>

<style>
/* ——————————— ORIGINAL ROMETRICS DARK STYLE ——————————— */
:root{
  --bg:#020617;
  --panel:#020617;
  --panel-soft:#020617;
  --accent:#38bdf8;
  --accent-soft:rgba(56,189,248,0.16);
  --accent-strong:#0ea5e9;
  --danger:#f97373;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --border:#1f2937;
  --good:#22c55e;
  --bad:#f97316;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100%;
  overflow-y:auto;
  background:radial-gradient(circle at top,#1f2937 0,#020617 55%);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}

body{
  display:flex;
  align-items:stretch;
  justify-content:center;
}
.app-shell{
  margin:10px;
  flex:1;
  max-width:1100px;
  border-radius:16px;
  border:1px solid rgba(148,163,184,.35);
  background:linear-gradient(135deg,rgba(15,23,42,0.97),rgba(15,23,42,0.99));
  box-shadow:0 18px 45px rgba(15,23,42,0.95);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
header{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
h1{font-size:16px;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:8px}
.logo-pill{
  padding:3px 9px;
  border-radius:999px;
  background:var(--accent-soft);
  font-size:11px;
  color:var(--accent-strong);
}
.subtitle{font-size:12px;color:var(--muted)}
.badge-mini{
  font-size:11px;
  padding:2px 8px;
  border-radius:999px;
  border:1px solid rgba(148,163,184,.35);
  color:var(--muted);
}

main{flex:1;display:flex;min-height:0}
.sidebar{
  width:240px;
  border-right:1px solid var(--border);
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.case-item{
  border-radius:10px;
  border:1px solid var(--border);
  padding:8px;
  background:rgba(15,23,42,0.88);
  cursor:pointer;
  transition:.12s;
}
.case-item:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}
.case-title{font-size:13px;font-weight:600}
.case-tagline{font-size:11px;color:var(--muted)}

.content{
  flex:1;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--panel-soft);
  padding:12px;
}
.card h3{font-size:14px;margin-bottom:6px}

.primary-btn{
  border:none;
  border-radius:999px;
  padding:7px 13px;
  background:linear-gradient(135deg,var(--accent),var(--accent-strong));
  color:#0b1120;
  font-weight:600;
  cursor:pointer;
}
.primary-btn:disabled{opacity:.4;cursor:not-allowed}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.75);
  display:none;align-items:center;justify-content:center;
}
.modal-backdrop.active{display:flex}
.modal{
  max-width:520px;
  width:100%;
  border-radius:14px;
  border:1px solid var(--border);
  background:#020617;
  padding:15px;
}
.modal-title{font-size:15px;font-weight:700;margin-bottom:8px}
.choice-btn{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#0f172a;
  color:var(--text);
  cursor:pointer;
}
.choice-btn:hover{border-color:var(--accent)}

/* Documentation Card */
.doc-card{
  margin-top:14px;
  border:1px solid var(--border);
  padding:14px;
  border-radius:12px;
  background:#0f172a;
  display:none;
}
.doc-section{
  margin-bottom:14px;
}
.doc-section label{
  display:block;
  margin-bottom:4px;
  font-size:13px;
  color:var(--muted);
}
textarea{
  width:100%;
  height:70px;
  resize:none;
  border-radius:8px;
  border:1px solid var(--border);
  background:#020617;
  color:var(--text);
  padding:8px;
}
</style>
</head>

<body>
<div class="app-shell">

<header>
  <div>
    <h1>ROMetrics <span class="logo-pill">Case Modules</span></h1>
    <div class="subtitle">Prototype flow — Case → View → Read → Launch Modules</div>
  </div>
  <div class="badge-mini">Module 4</div>
</header>

<main>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="case-item" id="caseBtn">
      <div class="case-title">Case 1</div>
      <div class="case-tagline">Loaded from Markdown</div>
    </div>
  </aside>

  <!-- Main Content -->
  <section class="content">

    <h2 id="caseTitle">Select a case to begin</h2>

    <div class="card" id="caseSnapshot">
      <h3>Case Snapshot</h3>
      <div id="snapshotBody">Select a case.</div>
    </div>

    <button id="readBtn" class="primary-btn" disabled>Mark Case as Read</button>

    <!-- Documentation Card (hidden) -->
    <div class="doc-card" id="docCard">
      <h3>Case Documentation</h3>

      <div class="doc-section">
        <label>ROM Findings</label>
        <textarea id="docROM"></textarea>
      </div>

      <div class="doc-section">
        <label>MMT Findings</label>
        <textarea id="docMMT"></textarea>
      </div>

      <div class="doc-section">
        <label>Your Diagnosis</label>
        <textarea id="docDx"></textarea>
      </div>

      <div class="doc-section">
        <label>Treatment Plan</label>
        <textarea id="docPlan"></textarea>
      </div>

      <div class="doc-section">
        <label>Goals</label>
        <textarea id="docGoals"></textarea>
      </div>

      <div class="doc-section">
        <label>Prognosis</label>
        <textarea id="docPrognosis"></textarea>
      </div>
    </div>

  </section>
</main>
</div>

<!-- Module Choice Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-title">What do you want to do next?</div>
    <button class="choice-btn" id="correctChoice">Start Goniometry Case Mode</button>
    <button class="choice-btn wrong">Review Documentation (Incorrect Order)</button>
    <button class="choice-btn wrong">Jump to Prognosis (Incorrect Order)</button>
  </div>
</div>

<script>
/* -------- LOAD CASE FILE -------- */
let caseLoaded = false;
let modules = { goniometry:false, mmt:false, motion:false };

document.getElementById("caseBtn").onclick = async () => {
  const res = await fetch("../assets/cases/case_001.md");
  const raw = await res.text();

  // split into lines
  const lines = raw.split("\n");

  // extract only these sections:
  // ## Patient Profile
  // ## Chief Complaint
  // ## History of Present Illness
  let allowed = ["## Patient Profile", "## Chief Complaint", "## History of Present Illness"];
  let capture = false;
  let out = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    if (allowed.includes(line)) {
      capture = true;
      out.push(`<strong>${line.replace("## ", "")}</strong>`);
      continue;
    }

    // Stop capturing when Objective Exam starts
    if (line.startsWith("## Objective Examination")) break;

    if (capture && line.length > 0) {
      out.push(line);
    }
  }

  document.getElementById("snapshotBody").innerHTML = out.join("<br><br>");

  caseLoaded = true;
/* ============================================================
   CASE READ BUTTON → OPEN STAGE 2 (CHOICE SCREEN)
============================================================ */
document.getElementById("readBtn").onclick = () => {
  if (!caseLoaded) return;
  showChoiceModal();
};

function showChoiceModal() {
  document.getElementById("modalBackdrop").classList.add("active");
}
</script>
</body>
</html>
