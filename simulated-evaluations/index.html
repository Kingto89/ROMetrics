<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ROMetrics — Case Modules Prototype</title>

<style>
  :root{
    --bg:#020617; --panel:#020617; --panel-soft:#020617;
    --accent:#38bdf8; --accent-soft:rgba(56,189,248,0.16);
    --accent-strong:#0ea5e9; --danger:#f97373;
    --text:#e5e7eb; --muted:#9ca3af; --border:#1f2937;
    --good:#22c55e; --bad:#f97316;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;background:radial-gradient(circle at top,#1f2937 0,#020617 55%);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);
  }
  body{display:flex;align-items:stretch;justify-content:center;}
  .app-shell{
    margin:10px;flex:1;max-width:1100px;border-radius:16px;
    border:1px solid rgba(148,163,184,.35);
    background:linear-gradient(135deg,rgba(15,23,42,0.97),rgba(15,23,42,0.99));
    box-shadow:0 18px 45px rgba(15,23,42,0.95);
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    padding:10px 14px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  h1{font-size:16px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .logo-pill{
    padding:3px 9px;border-radius:999px;background:var(--accent-soft);
    font-size:11px;color:var(--accent-strong);
  }
  main{flex:1;display:flex;min-height:0;}
  .sidebar{
    width:240px;border-right:1px solid var(--border);
    background:#020617;padding:10px;display:flex;flex-direction:column;gap:8px;
  }
  .case-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .case-item{
    border-radius:10px;border:1px solid var(--border);
    padding:8px 9px;background:rgba(15,23,42,0.88);cursor:pointer;
    display:flex;flex-direction:column;gap:2px;
    transition:.12s;
  }
  .case-item:hover{border-color:var(--accent);box-shadow:0 0 0 1px rgba(56,189,248,0.38);transform:translateY(-1px);}
  .case-item.active{border-color:var(--accent-strong);background:linear-gradient(135deg,#0f172a,#020617);}
  .content{
    flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:10px;
  }
  .summary-shell{margin-top:4px;display:flex;flex-direction:column;gap:10px;}
  @media(min-width:800px){.summary-shell{flex-direction:row}}
  .card{
    flex:1;border-radius:12px;border:1px solid var(--border);
    background:var(--panel-soft);padding:9px 11px;
  }
  /* Documentation Panel */
  #docPanel{
    margin-top:14px;border:1px solid var(--border);
    border-radius:12px;padding:12px 14px;background:#0b1120;
  }
  #docPanel.locked{opacity:.35;pointer-events:none;}
  #docPanel h3{margin-bottom:6px;font-size:15px;}
  #docPanel textarea{
    width:100%;min-height:60px;border-radius:8px;border:1px solid var(--border);
    background:#020617;color:var(--text);padding:6px;font-size:13px;margin-bottom:8px;
  }
  #submitDocBtn{
    margin-top:10px;padding:8px 14px;border-radius:999px;
    background:var(--accent);color:#0b1120;border:none;font-weight:600;cursor:pointer;
  }
  #scoreBox{margin-top:12px;font-size:14px;}
  .good{color:var(--good);} .bad{color:var(--danger);}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,0.78);display:none;
    align-items:center;justify-content:center;z-index:50;
  }
  .modal-backdrop.active{display:flex}
  .modal{
    width:100%;max-width:520px;margin:10px;border-radius:16px;
    background:#020617;border:1px solid rgba(148,163,184,0.6);
    padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;
  }
  .modal-body{max-height:55vh;overflow:auto;font-size:13px;color:var(--muted);line-height:1.5;}
</style>
</head>

<body>
<div class="app-shell">
  <header>
    <div class="title-block">
      <h1>ROMetrics <span class="logo-pill">Case Modules</span></h1>
      <div class="subtitle">Prototype flow — Case → View → Read → Launch Modules</div>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <h2 style="font-size:11px;color:var(--muted);text-transform:uppercase;">Cases</h2>
      <div class="case-list" id="caseList"></div>
    </aside>

    <section class="content">
      <div class="content-header">
        <div>
          <h2 id="caseTitle">Select a case to begin</h2>
          <p id="caseSubtitle">Cases load dynamically.</p>
        </div>
        <button id="startBtn" class="primary-btn" disabled><span class="dot"></span>Open Case</button>
      </div>

      <div class="summary-shell">
        <div class="card">
          <h3>Case snapshot</h3>
          <div id="casePreview" class="case-preview">Select a case.</div>
        </div>
      </div>

      <div id="docPanel" class="locked">
        <h3>Case Documentation</h3>
        <textarea id="romField" placeholder="Document ROM findings..."></textarea>
        <textarea id="mmtField" placeholder="Document MMT findings..."></textarea>
        <textarea id="diagField" placeholder="Your diagnosis..."></textarea>
        <textarea id="treatmentField" placeholder="Treatment Plan..."></textarea>
        <textarea id="goalsField" placeholder="Goals..."></textarea>
        <textarea id="prognosisField" placeholder="Prognosis..."></textarea>

        <button id="submitDocBtn">Submit Documentation</button>
        <div id="scoreBox"></div>
      </div>

    </section>
  </main>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="ghost-btn" id="closeModal">Close</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <button class="primary-btn" id="caseReadBtn"><span class="dot"></span>I have read this</button>
  </div>
</div>

<script>
/* CASE LOADING */
const CASE_FILES = [
  { id:"case_001", path:"./assets/cases/case_001.md" }
];

let loadedCases = [], selectedCase = null;

/* Parse Markdown */
async function loadCaseFile(id, path){
  const res = await fetch(path);
  const raw = await res.text();

  const jsonStart = raw.indexOf("{");
  const jsonEnd   = raw.indexOf("}")+1;
  const jsonText  = raw.slice(jsonStart, jsonEnd);
  const metadata  = JSON.parse(jsonText);

  const titleMatch = raw.match(/^#\s*(.+)$/m);
  const title = titleMatch ? titleMatch[1] : "Untitled Case";

  const preview = raw.split("\n").slice(10, 18).join(" ");

  return { id, raw, title, preview, metadata };
}

async function initCases(){
  for (let c of CASE_FILES){
    loadedCases.push(await loadCaseFile(c.id, c.path));
  }
  renderCaseList();
}

function renderCaseList(){
  const list = document.getElementById("caseList");
  list.innerHTML = "";
  loadedCases.forEach(c=>{
    const div=document.createElement("div");
    div.className="case-item";
    div.innerHTML=`<div class='case-title'>${c.title}</div>`;
    div.onclick=()=>selectCase(c.id);
    list.appendChild(div);
  });
}

function selectCase(id){
  selectedCase=loadedCases.find(x=>x.id===id);
  document.getElementById("caseTitle").textContent=selectedCase.title;
  document.getElementById("casePreview").textContent=selectedCase.preview;
  document.getElementById("startBtn").disabled=false;
}

/* MODAL */
document.getElementById("startBtn").onclick=()=>{
  document.getElementById("modalBody").textContent=selectedCase.raw;
  document.getElementById("modalTitle").textContent=selectedCase.title;
  document.getElementById("modalBackdrop").classList.add("active");
};
document.getElementById("closeModal").onclick=()=>{
  document.getElementById("modalBackdrop").classList.remove("active");
};

document.getElementById("caseReadBtn").onclick=()=>{
  document.getElementById("modalBackdrop").classList.remove("active");
  document.getElementById("docPanel").classList.remove("locked");
};

/* SCORING */
document.getElementById("submitDocBtn").onclick=()=>{
  const meta = selectedCase.metadata;
  const scoreBox = document.getElementById("scoreBox");
  let score = 0;

  const studentROM = document.getElementById("romField").value;
  const targetROM = meta.limits.goniometry_limit.cervical_left_rotation;

  if(studentROM.match(/\d+/)){
    const n = parseInt(studentROM.match(/\d+/)[0]);
    if(Math.abs(n-targetROM)<=5){score+=1;}
  }

  const studentMMT = document.getElementById("mmtField").value.trim();
  const targetMMT = meta.limits.mmt_target_grade.left_cervical_rotators;
  if(studentMMT.includes(targetMMT)) score+=1;

  const acceptedDx = ["facet dysfunction","joint sprain","mechanical cervical pain","cervical sprain"];
  const studentDx = document.getElementById("diagField").value.toLowerCase();
  if(acceptedDx.some(d=>studentDx.includes(d))) score+=1;

  let level="Novice";
  if(score===2) level="Apprentice";
  if(score===3) level="Clinical";

  scoreBox.innerHTML=`Score: ${score}/3 — <span class="${score===3?'good':'bad'}">${level}</span>`;
};

initCases();
</script>
</body>
</html>
