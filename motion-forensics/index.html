<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ROMetrics — Forensics Labs</title>

<style>
:root{
  --bg:#07101b;
  --card:#0f172a;
  --border:rgba(148,163,184,.25);
  --accent:#38bdf8;
  --text:#e6eef7;
  --muted:#9fb3cc;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  background:radial-gradient(900px 600px at 50% 20%, rgba(56,189,248,.08), var(--bg));
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;
  color:var(--text);
}

main{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
}

.card{
  width:min(980px,100%);
  background:rgba(9,20,37,.78);
  border:1px solid var(--border);
  border-radius:28px;
  box-shadow:0 30px 90px rgba(0,0,0,.45);
  padding:26px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
}

.title{
  font-size:26px;
  font-weight:900;
  letter-spacing:.3px;
}

.subtitle{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
}

.model-select{
  background:rgba(15,23,42,.7);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 14px;
  border-radius:14px;
  font-size:14px;
}

.grid{
  margin-top:22px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
}

.module{
  position:relative;
  background:linear-gradient(180deg, rgba(15,23,42,.9), rgba(8,16,28,.9));
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}

.module:hover{
  transform:translateY(-4px);
  border-color:rgba(56,189,248,.55);
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}

.mod-num{
  font-size:40px;
  font-weight:900;
  color:var(--accent);
}

.mod-title{
  margin-top:6px;
  font-size:15px;
  font-weight:800;
}

.mod-desc{
  margin-top:6px;
  font-size:13px;
  color:var(--muted);
  line-height:1.25;
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:#8aa2bf;
}
</style>
</head>

<body>
<main>
  <div class="card">

    <div class="header">
      <div>
        <div class="title">Forensics Labs</div>
        <div class="subtitle">Choose a model, then select a module</div>
      </div>

      <select id="modelSelect" class="model-select">
        <option value="Roma">Roma (default)</option>
        <option value="Roman">Roman</option>
      </select>
    </div>

    <div class="grid">
      <div class="module" data-module="FL-001" data-href="/forensics/fl001/">
        <div class="mod-num">01</div>
        <div class="mod-title">Metabolic Demand</div>
        <div class="mod-desc">Cardio Bay — speed, energy, fatigue</div>
      </div>

      <div class="module" data-module="FL-002" data-href="/forensics/fl002/">
        <div class="mod-num">02</div>
        <div class="mod-title">Joint Load Lever</div>
        <div class="mod-desc">Movement Analysis Booth</div>
      </div>

      <div class="module" data-module="FL-003" data-href="/forensics/fl003/">
        <div class="mod-num">03</div>
        <div class="mod-title">Motion Forensics</div>
        <div class="mod-desc">Stability, balance, reaction</div>
      </div>
    </div>

    <div class="footer">
      ROMetrics • Forensics Training Platform
    </div>

  </div>
</main>

<script>
const modelSelect = document.getElementById('modelSelect');

document.querySelectorAll('.module').forEach(card=>{
  card.addEventListener('click', ()=>{
    const model = modelSelect.value;
    const moduleId = card.dataset.module;
    const href = card.dataset.href;

    window.location.href =
      `${href}?model=${encodeURIComponent(model)}&module=${encodeURIComponent(moduleId)}`;
  });
});
</script>
</body>
</html>
