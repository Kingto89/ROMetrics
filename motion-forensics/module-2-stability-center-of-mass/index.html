// --- GLOBAL STATE & MD CACHE ---
let cachedModuleMD = "";
window.currentTrials = { mcqs: [] }; 

// --- TAB NAVIGATION LOGIC (MODAL) ---
window.showTab = function(tabName) {
    const content = document.getElementById('tabContent');
    
    // Manage UI Tab States
    document.querySelectorAll('#trialHelpModal .pill').forEach(p => p.classList.remove('active'));
    const activeTab = document.getElementById('tab-' + tabName);
    if (activeTab) activeTab.classList.add('active');

    if (!cachedModuleMD) {
        content.innerHTML = "Fetching forensic module data...";
        return;
    }

    // A. Global Section: Module Instructions
    if (tabName === 'guide') {
        const guideRegex = /###\s*Module\s*Instructions/i;
        const guideMatch = cachedModuleMD.match(guideRegex);
        if (guideMatch) {
            let guideBlock = cachedModuleMD.slice(guideMatch.index + guideMatch[0].length);
            const qIdx = guideBlock.search(/Checkpoint\s*Questions/i);
            if (qIdx !== -1) guideBlock = guideBlock.slice(0, qIdx);
            content.innerHTML = formatMD(guideBlock);
        }
        return;
    }

    // B. Concept & Trial Guide (Generic for Module 2 Analysis)
    let searchRegex;
    if (tabName === 'concept') searchRegex = /###\s*Concept\s*\(read\s*first\):/i;
    if (tabName === 'systems') searchRegex = /###\s*Trial\s*Guide:/i;

    const headerMatch = cachedModuleMD.match(searchRegex);
    if (headerMatch) {
        const fromStart = cachedModuleMD.slice(headerMatch.index + headerMatch[0].length);
        const endIdx = fromStart.indexOf('---');
        content.innerHTML = formatMD(endIdx !== -1 ? fromStart.slice(0, endIdx) : fromStart);
    } else {
        content.innerHTML = `Heading for "${tabName}" not found.`;
    }
};

// --- MARKDOWN FORMATTING HELPER ---
function formatMD(text) {
    return text.trim()
        .replace(/\n/g, '<br>')
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
        .replace(/\_(.*?)\_/g, '<i>$1</i>')
        .replace(/\#+/g, '') 
        .replace(/\$\$(.*?)\$\$/g, '<div style="background:rgba(56,189,248,0.1); padding:12px; border-radius:10px; color:#38bdf8; font-family:monospace; margin:15px 0; text-align:center; border:1px solid rgba(56,189,248,0.2); font-size:1.1em;">$1</div>');
}

// --- MODULE 2 COMPLETION & MCQ TRIGGER ---
window.renderMCQ = function() {
    const $trialMsg = document.getElementById('trialMsg');
    sim.running = false;
    if (window.controls) window.controls.enabled = true; 

    $trialMsg.innerHTML = `<b style="color:#38bdf8;">Forensic Validation Successful.</b> Stability analysis complete.`;
    
    const aBtn = document.getElementById('assessmentBtn');
    if (aBtn) {
        aBtn.style.display = 'block';
        const modId = document.getElementById('moduleSelect').value || "FL-002";
        aBtn.onclick = () => { 
            window.open(`https://kingto89.github.io/ROMetrics.com/motion-forensics/MCQ/?module=${modId}`, '_blank'); 
        };
    }
};

// --- GLOBAL HELP BUTTON WIRING ---
document.getElementById('trialHelp').onclick = async (e) => {
    e.preventDefault();
    e.stopPropagation();
    document.getElementById('trialHelpModal').style.display = 'flex';
    
    const modId = document.getElementById('moduleSelect').value || "FL-001";
    const fileName = modId.toLowerCase().replace('fl-', 'module_');
    const path = `https://raw.githubusercontent.com/Kingto89/ROMetrics.com/main/assets/forensics_modules/${fileName}.md`;
    
    try {
        const res = await fetch(path);
        if (res.ok) {
            cachedModuleMD = await res.text();
            window.showTab('concept'); 
        } else {
            document.getElementById('tabContent').innerHTML = "Failed to load module instructions.";
        }
    } catch (err) { 
        console.error("MD Load Error", err); 
    }
};

// --- MODAL CLOSE WIRING ---
document.getElementById('trialHelpClose').onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    document.getElementById('trialHelpModal').style.display = 'none';
};

function applyFL002Pose(poseName) {
    if (!skeleton) {
        console.warn("Pose failed: Global skeleton variable is null.");
        return;
    }

    const pose = FL002_POSES[poseName];
    if (!pose) return;

    console.log(`Applying ${poseName} pose...`);

    for (const boneName in pose) {
        // Use getBoneByName or find a partial match to handle prefixes
        const bone = skeleton.bones.find(b => b.name.includes(boneName));
        
        if (bone) {
            const r = pose[boneName];
            bone.rotation.set(r.x, r.y, r.z);
        }
    }
}

    function makeScreenCanvas(w=512,h=256){

 function roundRect(ctx, x, y, w, h, r){
  const min = Math.min(w,h);
  if (r > min/2) r = min/2;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

async function loadSelectedModel(modelId, onProgress) {
  const m = getModel(modelId);

  if (!m || !m.url) {
    ACTIVE_MODEL_ID = m?.id || null;

    if (avatarRoot) {
      scene.remove(avatarRoot);
      avatarRoot = null;
    }

    avatarRoot = buildPreviewMannequin();
    scene.add(avatarRoot);
    animate._getSkeleton(avatarRoot);
    return avatarRoot;
  }

  ACTIVE_MODEL_ID = m.id;

  if (avatarRoot) {
    scene.remove(avatarRoot);
    avatarRoot = null;
  }

  return new Promise((resolve, reject) => {
    const loader = new GLTFLoader();

    loader.load(
      m.url,
      (gltf) => {
        avatarRoot = gltf.scene || (gltf.scenes && gltf.scenes[0]) || null;

        if (!avatarRoot) return reject(new Error("GLB loaded but scene is empty"));

        // Normalize height to ~1.75m
        avatarRoot.updateWorldMatrix(true, true);

        const meshBoxes = [];
        const mean = new THREE.Vector3();
        let n = 0;

        avatarRoot.traverse((o) => {
          if (!(o.isMesh || o.isSkinnedMesh) || !o.geometry) return;
          if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();

          const b = new THREE.Box3().copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
          const center = new THREE.Vector3();
          b.getCenter(center);
          meshBoxes.push({ b, center });
          mean.add(center);
          n++;
        });

        if (n > 0) {
          mean.multiplyScalar(1 / n);
          const box = new THREE.Box3();
          for (const it of meshBoxes) {
            if (it.center.distanceTo(mean) < 5.0) box.union(it.b);
          }

          const size = new THREE.Vector3();
          box.getSize(size);

          if (size.y > 1e-6) {
            const targetH = 1.75;
            const s = targetH / size.y;
            avatarRoot.scale.setScalar(s);
            avatarRoot.updateWorldMatrix(true, true);
          }
        }

        scene.add(avatarRoot);

// Ensure these lines exist here to drive the model animation:
if (gltf.animations && gltf.animations.length) {
    mixer = new THREE.AnimationMixer(avatarRoot);
    const clip = gltf.animations.find(c => /run|jog|walk/i.test(c.name)) || gltf.animations[0];
    runAction = mixer.clipAction(clip);
    runAction.play();
    runAction.paused = true; // Stay paused until the user clicks "Start"
}  
        resolve(avatarRoot);
      },
      (xhr) => {
        if (!onProgress) return;
        const loaded = xhr?.loaded || 0;
        const totalRaw = xhr?.total || 0;
        const total = totalRaw >= loaded ? totalRaw : loaded;
        onProgress(total ? Math.round((loaded / total) * 100) : null);
      },
      (err) => reject(err)
    );
  });
}

// Global registry for module-specific update functions

function animate() {
    requestAnimationFrame(animate);


// --- UNIVERSAL BLINK LOGIC ---
    if (!animate._blink) animate._blink = { targets: [], state: 0, t: 0, next: 0, lastModel: null };
    const BL = animate._blink;

    // 1. Auto-detect Morph Targets if model changed
    if (avatarRoot && BL.lastModel !== avatarRoot) {
        BL.targets = [];
        BL.lastModel = avatarRoot;
        BL.next = (performance.now() / 1000) + 2;
        avatarRoot.traverse(o => {
            if (o.isMesh && o.morphTargetDictionary) {
                const keys = ["Eye_Blink", "Eye_Blink_L", "Eye_Blink_R", "Expressions_eyeClosedL_max", "Expressions_eyeClosedR_max"];
                keys.forEach(k => {
                    if (o.morphTargetDictionary[k] != null) BL.targets.push({ mesh: o, idx: o.morphTargetDictionary[k] });
                });
            }
        });
    }

    // 2. Execution Loop
    if (BL.targets.length) {
        const now = performance.now() / 1000;
        if (BL.state === 0 && now >= BL.next) {
            BL.state = 1; BL.t = 0;
            BL.next = now + 3 + Math.random() * 4; // Randomize next blink 3-7s
        }
        const setB = (v) => BL.targets.forEach(t => t.mesh.morphTargetInfluences[t.idx] = v);
        const dur = { down: 0.07, hold: 0.03, up: 0.12 };
        if (BL.state !== 0) {
            BL.t += dt;
            if (BL.state === 1) { // Closing
                setB(Math.min(1, BL.t / dur.down));
                if (BL.t >= dur.down) { BL.state = 2; BL.t = 0; }
            } else if (BL.state === 2) { // Hold
                setB(1);
                if (BL.t >= dur.hold) { BL.state = 3; BL.t = 0; }
            } else if (BL.state === 3) { // Opening
                setB(1 - Math.min(1, BL.t / dur.up));
                if (BL.t >= dur.up) { BL.state = 0; setB(0); }
            }
        }
    }

            };

  // treadmill motion
