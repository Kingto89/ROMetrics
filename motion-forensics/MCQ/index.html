<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ROMetrics — Forensic Assessment Hub</title>
  <style>
    body { background:#07101b; color:#e5eefc; font-family:system-ui,-apple-system,sans-serif; margin:0; padding:40px 20px; display:flex; flex-direction:column; align-items:center; }
    #hub { max-width:800px; width:100%; }
    .header { text-align:center; margin-bottom:40px; }
    .header h1 { color:#38bdf8; font-size:32px; margin:0; }
    
    /* Accordion Styles */
    .module-row { background:rgba(15,23,42,.78); border:1px solid rgba(148,163,184,.2); border-radius:16px; margin-bottom:12px; overflow:hidden; transition: 0.3s; }
    .module-header { padding:20px 24px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; user-select:none; }
    .module-header:hover { background:rgba(56,189,248,.05); }
    .module-title { font-weight:800; font-size:18px; }
    .status-badge { font-size:12px; font-weight:900; padding:4px 10px; border-radius:99px; }
    .status-pending { background:rgba(148,163,184,0.1); color:#a8c0da; }
    .status-done { background:rgba(74,222,128,0.1); color:#4ade80; border:1px solid rgba(74,222,128,0.2); }

    .module-content { display:none; padding:0 32px 32px 32px; border-top:1px solid rgba(148,163,184,.1); }
    .module-row.active { border-color:#38bdf8; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
    .module-row.active .module-content { display:block; }

    /* Quiz Area Styles */
    .q-block { margin-top:30px; }
    .q-text { font-weight:700; font-size:16px; margin-bottom:15px; color:#cfe3ff; }
    .opt { display:block; border:1px solid rgba(148,163,184,.15); background:rgba(7,16,27,.3); padding:12px 16px; border-radius:12px; margin-bottom:8px; cursor:pointer; font-size:14px; }
    .opt.selected { border-color:#38bdf8; background:rgba(56,189,248,.1); }
    .opt.correct-review { border-color:#4ade80; background:rgba(74,222,128,0.05); color:#4ade80; }
    
    .btn { background:#38bdf8; color:#07101b; border:none; padding:14px; border-radius:12px; font-weight:900; cursor:pointer; width:100%; margin-top:20px; }
    .btn-outline { background:transparent; border:1px solid #38bdf8; color:#38bdf8; }
    #returnBtn { margin-bottom:20px; max-width:200px; align-self: flex-start;}
  </style>
</head>
<body>

<div id="hub">
  <button id="returnBtn" class="btn btn-outline" onclick="window.location.href='index.html'">← Back to Studio</button>
  
  <div class="header">
    <h1>Forensic Assessment Hub</h1>
    <p style="color:#a8c0da">Select a module to validate your forensic findings.</p>
  </div>

  <div id="accordionContainer"></div>
</div>

<script type="module">
  const TOTAL_MODULES = 10;
  const params = new URLSearchParams(window.location.search);
  const autoOpen = params.get('module'); // e.g., FL-001
  
  function initHub() {
    const container = document.getElementById('accordionContainer');
    
    for (let i = 1; i <= TOTAL_MODULES; i++) {
      const id = `FL-${String(i).padStart(3, '0')}`;
      const isDone = localStorage.getItem(`${id}_Status`) === 'completed';
      
      const row = document.createElement('div');
      row.className = `module-row ${autoOpen === id ? 'active' : ''}`;
      row.id = `row-${id}`;
      
      row.innerHTML = `
        <div class="module-header" onclick="toggleModule('${id}')">
          <div class="module-title">Module ${i}: Forensic Data Validation</div>
          <div class="status-badge ${isDone ? 'status-done' : 'status-pending'}">
            ${isDone ? '✓ COMPLETED' : 'PENDING'}
          </div>
        </div>
        <div class="module-content" id="content-${id}">
          <div class="quiz-loading">Fetching forensic data...</div>
        </div>
      `;
      
      container.appendChild(row);
      
      // If it's the one we need to open, load it immediately
      if (autoOpen === id) {
        loadModuleData(id);
      }
    }
  }

  window.toggleModule = function(id) {
    const rows = document.querySelectorAll('.module-row');
    const target = document.getElementById(`row-${id}`);
    const isActive = target.classList.contains('active');
    
    rows.forEach(r => r.classList.remove('active'));
    
    if (!isActive) {
      target.classList.add('active');
      loadModuleData(id);
    }
  };

  async function loadModuleData(modId) {
    const contentDiv = document.getElementById(`content-${modId}`);
    const fileName = modId.toLowerCase().replace('fl-', 'module_');
    const path = `https://raw.githubusercontent.com/Kingto89/ROMetrics.com/main/assets/forensics_modules/${fileName}.md`;

    try {
      const res = await fetch(path);
      if (!res.ok) throw new Error("Module file not found");
      const md = await res.text();
      const quizData = parseQuiz(md);
      renderQuiz(modId, quizData);
    } catch (err) {
      contentDiv.innerHTML = `<div style="padding:20px; color:#f87171;">Module file ${fileName}.md not found on GitHub.</div>`;
    }
  }

  function parseQuiz(md) {
    const questions = [];
    const blocks = md.split('**Checkpoint');
    blocks.shift();
    blocks.forEach((block, idx) => {
      const lines = block.split('\n').map(l => l.trim()).filter(l => l);
      const options = lines.filter(l => /^[A-D]\./.test(l));
      const ansMatch = block.match(/Answer.*?([A-D])/i);
      if (options.length && ansMatch) {
        questions.push({
          q: lines[1] || "Question text error",
          opts: options,
          correct: ansMatch[1].toUpperCase()
        });
      }
    });
    return questions;
  }

  function renderQuiz(modId, questions) {
    const contentDiv = document.getElementById(`content-${modId}`);
    const isDone = localStorage.getItem(`${modId}_Status`) === 'completed';
    contentDiv.innerHTML = '';

    questions.forEach((item, qIdx) => {
      const qBlock = document.createElement('div');
      qBlock.className = 'q-block';
      qBlock.innerHTML = `<div class="q-text">${qIdx + 1}. ${item.q}</div>`;

      item.opts.forEach(opt => {
        const letter = opt.charAt(0);
        const div = document.createElement('div');
        div.className = 'opt';
        div.textContent = opt;
        
        // Review mode logic
        if (isDone && letter === item.correct) {
          div.classList.add('correct-review');
          div.innerHTML += " <b>(Correct Finding)</b>";
        }

        if (!isDone) {
          div.onclick = () => {
            qBlock.querySelectorAll('.opt').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            item.userAnswer = letter;
          };
        }
        qBlock.appendChild(div);
      });
      contentDiv.appendChild(qBlock);
    });

    if (!isDone) {
      const subBtn = document.createElement('button');
      subBtn.className = 'btn';
      subBtn.textContent = 'Submit Assessment';
      subBtn.onclick = () => submitQuiz(modId, questions, subBtn);
      contentDiv.appendChild(subBtn);
    } else {
      const msg = document.createElement('div');
      msg.style.cssText = "margin-top:20px; padding:15px; background:rgba(74,222,128,0.1); color:#4ade80; border-radius:12px; text-align:center; font-weight:800;";
      msg.textContent = "VALIDATION COMPLETE: This module has been verified.";
      contentDiv.appendChild(msg);
    }
  }

  function submitQuiz(modId, questions, btn) {
    let score = 0;
    const allAnswered = questions.every(q => q.userAnswer);

    if (!allAnswered) {
      alert("Please record all forensic answers before submitting.");
      return;
    }

    questions.forEach(q => { if (q.userAnswer === q.correct) score++; });

    if (score === questions.length) {
      localStorage.setItem(`${modId}_Status`, 'completed');
      alert("PERFECT SCORE. Module data validated.");
      location.reload(); // Refresh to update checkmarks
    } else {
      alert(`Score: ${score}/${questions.length}. Inaccurate findings. Review the simulation data and try again.`);
    }
  }

  initHub();
</script>
</body>
</html>
